<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS:GO Weapon Armory</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181a24;
            --accent-color: #de9b07;
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --border-color: #2a2e3d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 2rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header h1 span {
            color: var(--accent-color);
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.5rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .product-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(222, 155, 7, 0.15);
            border-color: var(--accent-color);
        }

        .weapon-image {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #222634 0%, #13151d 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 1rem;
        }

        .weapon-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }

        .rarity-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .covert { background-color: #eb4b4b; color: #fff; }
        .classified { background-color: #d32ce6; color: #fff; }
        .restricted { background-color: #8847ff; color: #fff; }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .weapon-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .weapon-skin {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 1rem;
        }

        .price {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        .buy-btn {
            background-color: transparent;
            color: var(--text-primary);
            border: 1px solid var(--accent-color);
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s, color 0.2s;
        }

        .buy-btn:hover {
            background-color: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

    <header>
        <h1>CS:GO / CS2 <span>Armory</span></h1>
        <p>Explore elite weapon skins available on the marketplace.</p>
    </header>

    <div class="grid-container" id="product-grid">
        <!-- Products will be injected via JavaScript -->
    </div>

    <script>
        
           const weapons = [
  { name: "AWP", skin: "Asiimov", rarity: "covert", price: "$115.00", img: "images/awp assimov.webp" },
  { name: "AK-47", skin: "Fire Serpent", rarity: "covert", price: "$850.00", img: "images/AK-47 (colorful multi-pattern).webp" },
  { name: "M4A4", skin: "Howl", rarity: "covert", price: "$3,500.00", img: "images/AK-47 (pinkblue pattern).webp" },
  { name: "Desert Eagle", skin: "Printstream", rarity: "covert", price: "$45.00", img: "images/Pistol (USP-SGlock style, white pattern).webp" },
  { name: "Karambit", skin: "Doppler", rarity: "covert", price: "$1,200.00", img: "images/Karambit (bluepurple fade — looks Doppler-style).webp" },
  { name: "M4A1-S", skin: "Printstream", rarity: "covert", price: "$110.00", img: "images/M4A1-S (whitesilver, Printstream-style).webp" },
  { name: "USP-S", skin: "Kill Confirmed", rarity: "covert", price: "$75.00", img: "images/AK-47 (orange marbled pattern).webp" },
  { name: "Glock-18", skin: "Water Elemental", rarity: "restricted", price: "$8.50", img: "images/Glock-18 (rainbow fade — pinkorangeblue).webp" },
  { name: "Butterfly Knife", skin: "Fade", rarity: "covert", price: "$2,800.00", img: "images/Butterfly Knife (redorange fade).webp" },
  { name: "AWP", skin: "Neo-Noir", rarity: "covert", price: "$28.00", img: "images/Rifle (AK-47M4 style, light pattern).webp" },
  { name: "AK-47", skin: "Vulcan", rarity: "covert", price: "$240.00", img: "images/Rifle (greengold pattern).webp" },
  { name: "AK-47", skin: "Case Hardened", rarity: "classified", price: "$160.00", img: "images/AK-47 (whiteblue pattern).webp" },
  { name: "M4A1-S", skin: "Hyper Beast", rarity: "covert", price: "$35.00", img: "images/M4A1rifle (red pattern).webp" },
  { name: "AWP", skin: "Hyper Beast", rarity: "covert", price: "$55.00", img: "images/M4A1-S (whiteblack).webp" },
  { name: "USP-S", skin: "Orion", rarity: "classified", price: "$40.00", img: "images/AK-47 (redgold snake-style pattern).webp" },
  { name: "AWP", skin: "Dragon Lore", rarity: "covert", price: "$8,000.00", img: "images/Rifle (goldtan camo pattern).webp" },
  { name: "Desert Eagle", skin: "Blaze", rarity: "restricted", price: "$400.00", img: "images/Desert Eagle (orangefire pattern).webp" },
  { name: "Glock-18", skin: "Fade", rarity: "restricted", price: "$650.00", img: "images/Glock-18 (redblue splatter pattern).webp" },
  { name: "M4A4", skin: "Neo-Noir", rarity: "classified", price: "$14.50", img: "images/AK-47 (pinkpurple pattern).webp" },
  { name: "Talon Knife", skin: "Tiger Tooth", rarity: "covert", price: "$420.00", img: "images/Karambit (tangold striped blade, white handle).webp" }
];

        const gridContainer = document.getElementById('product-grid');
        if (!gridContainer) {
            console.error('Product grid element not found');
        }

        weapons.forEach(item => {
            const card = document.createElement('div');
            card.className = 'product-card';
            
            card.innerHTML = `
                <div class="weapon-image">
                    <span class="rarity-badge ${item.rarity}">${item.rarity}</span>
                    <img src="${item.img}" alt="${item.name} ${item.skin}">
                </div>
                <div class="product-info">
                    <div>
                        <div class="weapon-name">${item.name}</div>
                        <div class="weapon-skin">${item.skin}</div>
                    </div>
                    <div class="card-footer">
                        <span class="price">${item.price}</span>
                        <button class="buy-btn" onclick="alert('Added ${item.name} ${item.skin} to cart!')">Buy Now</button>
                    </div>
                </div>
            `;
            
            gridContainer.appendChild(card);
        });
    </script>
</body>
</html>
